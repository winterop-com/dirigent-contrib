[project]
name = "dirigent-chap"
version = "0.27.1"
description = "The Chap pack for dirigent: a connection kind and the blocks for one Chap (chap-core) server."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-common==0.27.1",
    "dirigent-plugin==0.27.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.5",
]

[project.urls]
Documentation = "https://winterop-com.github.io/dirigent-contrib/"
Repository = "https://github.com/winterop-com/dirigent-contrib"

[project.entry-points."dirigent.plugins.v1"]
chap = "dirigent_chap:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"
