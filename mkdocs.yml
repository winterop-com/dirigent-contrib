site_name: dirigent-contrib
site_description: Block packs for dirigent that reach outside systems, one package per system.
site_url: https://winterop-com.github.io/dirigent-contrib/
repo_url: https://github.com/winterop-com/dirigent-contrib
edit_uri: ""

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Install: install.md
  - Chap:
      - Overview: chap/index.md
      - Connection: chap/connection.md
      - Blocks: chap/blocks.md
      - Examples: chap/examples.md
  - The open climate service:
      - Overview: climate/index.md
      - Connection: climate/connection.md
      - Blocks: climate/blocks.md
      - Examples: climate/examples.md
  - Releases: releases.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/winterop-com/dirigent-contrib
