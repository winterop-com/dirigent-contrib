name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing major tags at v8, so pin the exact version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync the environment
        run: uv sync --locked

      # --strict fails the build on any warning, including a broken internal link. The
      # variable silences Material's notice about MkDocs 2.0.
      - name: Build the site
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
