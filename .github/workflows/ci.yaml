name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-dependency-glob: "**/uv.lock"
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types (mypy)
        run: uv run mypy
      - name: Types (pyright)
        run: uv run pyright
      - name: Test
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-dependency-glob: "**/uv.lock"
      - name: Sync
        run: uv sync --locked
      # --strict fails on any warning, so a broken link is caught here rather than on main.
      - name: Docs
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
